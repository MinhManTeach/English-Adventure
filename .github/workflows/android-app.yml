# Builds an Android test app (APK) from the web build, to install on a phone.
# The file appears under "Artifacts" on the workflow run page in GitHub Actions.
name: Android app (APK thử)

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: bun install --frozen-lockfile
      - run: bunx vite build && bunx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: english-adventure-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
